<!doctype html>
<html><head><meta charset="utf-8"><title>Isekai Chaos Mockup</title>
<style>
  :root { --ink:#1b1630; --gold:#ffd25e; --hp:#ff4f6d; --en:#4fc3ff; --panel:rgba(22,18,44,.78); --edge:#f4e3b5; }
  body { margin:0; background:#111; font-family: Inter, "IPAGothic", sans-serif; }
  .frame { width:1600px; height:900px; position:relative; overflow:hidden; }
  svg { display:block; }
  .t { font-family: Inter, "IPAGothic", sans-serif; }
</style></head>
<body>
<div class="frame" id="f1"><svg id="s1" width="1600" height="900" viewBox="0 0 1600 900"></svg></div>
<div class="frame" id="f2"><svg id="s2" width="1600" height="900" viewBox="0 0 1600 900"></svg></div>
<script>
const NS = "http://www.w3.org/2000/svg";
let rnd = (()=>{ let s = 7; return ()=> (s = (s*16807)%2147483647)/2147483647; })();
function el(tag, attrs, parent, text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!==undefined) e.textContent=text; if(parent) parent.appendChild(e); return e; }
function poly(pts, attrs, p){ return el('polygon', Object.assign({points: pts.map(q=>q.join(',')).join(' ')}, attrs), p); }

// ---------------------------------------------------------------- shared defs
function defs(svg){
  const d = el('defs',{},svg);
  d.innerHTML = `
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#e9f7ff"/></linearGradient>
  <radialGradient id="vign" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1b1630" stop-opacity=".45"/></radialGradient>
  <linearGradient id="hpG" x1="0" x2="1"><stop offset="0" stop-color="#ff7a8f"/><stop offset="1" stop-color="#ff3d5e"/></linearGradient>
  <linearGradient id="enG" x1="0" x2="1"><stop offset="0" stop-color="#8be0ff"/><stop offset="1" stop-color="#2ea8ff"/></linearGradient>
  <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3f86"/><stop offset="1" stop-color="#221b47"/></linearGradient>
  <linearGradient id="btnGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#d9a441"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient>
  <radialGradient id="water" cx=".4" cy=".4"><stop offset="0" stop-color="#7fe3ff"/><stop offset="1" stop-color="#2f8fd6"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>`;
}

// ---------------------------------------------------------------- iso world
const TW=96, TH=48;
function mkIso(cx, cy){ return (x,y,z=0)=>[cx+(x-y)*TW/2, cy+(x+y)*TH/2 - z]; }

function grassColor(x,y){ const n = rnd(); const base = [[126,200,96],[118,192,90],[134,206,102],[112,186,88]][Math.floor(n*4)]; return `rgb(${base[0]},${base[1]},${base[2]})`; }

function drawGround(g, P, N, roadFn, waterFn, plotFn){
  for(let s=0;s<=2*N;s++) for(let x=0;x<=N;x++){ const y=s-x; if(y<0||y>N) continue;
    let fill = grassColor(x,y), stroke='rgba(0,0,0,.05)';
    if(waterFn && waterFn(x,y)) { fill='url(#water)'; stroke='rgba(255,255,255,.25)'; }
    else if(plotFn && plotFn(x,y)) { fill = (x+y)%2? '#c9a46a':'#c19b60'; stroke='rgba(80,50,20,.25)'; }
    else if(roadFn && roadFn(x,y)) { const r=roadFn(x,y); fill = r==='cobble' ? ((x+y)%2?'#cbbfa8':'#bfb39c') : ((x+y)%2?'#d9b57e':'#cfa974'); stroke='rgba(90,60,30,.25)'; }
    poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)], {fill, stroke, 'stroke-width':1}, g);
    if(!(roadFn&&roadFn(x,y)) && !(waterFn&&waterFn(x,y)) && !(plotFn&&plotFn(x,y))){
      // grass tufts & flowers
      for(let k=0;k<3;k++){ const [px,py]=P(x+rnd(),y+rnd());
        if(rnd()<.18){ const c=['#fff','#ffd84a','#ff8fb6','#b9a2ff'][Math.floor(rnd()*4)]; el('circle',{cx:px,cy:py-2,r:3,fill:c},g); el('circle',{cx:px,cy:py-2,r:1.2,fill:'#ffb300'},g);}
        else el('path',{d:`M${px-4},${py} q2,-8 4,-10 q1,6 0,10 q3,-6 6,-7 q-2,5 -3,7`,fill:'#5fae4a',opacity:.8},g); }
    }
    if(roadFn && roadFn(x,y)==='cobble'){ for(let k=0;k<4;k++){ const [px,py]=P(x+.15+rnd()*.7,y+.15+rnd()*.7); el('ellipse',{cx:px,cy:py,rx:7,ry:3.5,fill:'rgba(120,105,85,.35)'},g);} }
  }
}

// tree (anime puffy canopy)
function tree(g, x, y, s=1, hue='g'){
  const c = hue==='pink' ? ['#f7a8c8','#ffc6dc','#ffe0ec'] : hue==='glow' ? ['#4fbf9a','#78e0b8','#b4ffe0'] : ['#3f9a4c','#58b85a','#86d672'];
  el('ellipse',{cx:x+18*s,cy:y+4,rx:38*s,ry:14*s,fill:'rgba(0,0,0,.18)'},g);
  el('path',{d:`M${x-7*s},${y} L${x-5*s},${y-55*s} L${x+5*s},${y-55*s} L${x+7*s},${y} Z`,fill:'#7a4e2d'},g);
  const blobs=[[0,-95,42],[-30,-70,30],[30,-72,32],[-14,-118,28],[18,-112,30],[0,-60,30]];
  blobs.forEach(([dx,dy,r])=> el('circle',{cx:x+dx*s,cy:y+dy*s,r:r*s,fill:c[0]},g));
  blobs.forEach(([dx,dy,r])=> el('circle',{cx:x+dx*s-4*s,cy:y+dy*s-5*s,r:r*s*.78,fill:c[1]},g));
  [[-10,-120,10],[14,-100,8],[-28,-80,7]].forEach(([dx,dy,r])=> el('circle',{cx:x+dx*s,cy:y+dy*s,r:r*s,fill:c[2],opacity:.9},g));
}

// iso building
function house(g, P, x, y, w, d, h, wall, roof, opts={}){
  const A=P(x,y), B=P(x+w,y), C=P(x+w,y+d), D=P(x,y+d);
  const up=(p)=>[p[0],p[1]-h];
  el('ellipse',{cx:(B[0]+D[0])/2+20,cy:C[1]-4,rx:(B[0]-D[0])/2+20,ry:18,fill:'rgba(0,0,0,.15)'},g);
  poly([D,C,up(C),up(D)],{fill:wall[0],stroke:'#3b2a1f','stroke-width':2},g);   // front-left wall
  poly([C,B,up(B),up(C)],{fill:wall[1],stroke:'#3b2a1f','stroke-width':2},g);   // front-right wall
  // timber frame lines
  [0.33,0.66].forEach(t=>{ const p1=[D[0]+(C[0]-D[0])*t, D[1]+(C[1]-D[1])*t]; el('line',{x1:p1[0],y1:p1[1],x2:p1[0],y2:p1[1]-h,stroke:'#6b4a31','stroke-width':3},g); });
  // door + windows
  const m=[(D[0]+C[0])/2,(D[1]+C[1])/2];
  el('path',{d:`M${m[0]-12},${m[1]} v-34 q12,-12 24,0 v34 z`,fill:'#5b3a22',stroke:'#2d1d12','stroke-width':2},g);
  const wpos=[[ (C[0]*0.7+B[0]*0.3), (C[1]*0.7+B[1]*0.3) ],[ (C[0]*0.3+B[0]*0.7), (C[1]*0.3+B[1]*0.7) ]];
  wpos.forEach(([wx,wy])=>{ poly([[wx-11,wy-h*0.55+6],[wx+11,wy-h*0.55-5],[wx+11,wy-h*0.55+15],[wx-11,wy-h*0.55+26]],{fill:'#ffe9a3',stroke:'#3b2a1f','stroke-width':2},g); });
  // roof (hip)
  const ov=0.25, rh=opts.roofH||60;
  const RA=P(x-ov,y-ov), RB=P(x+w+ov,y-ov), RC=P(x+w+ov,y+d+ov), RD=P(x-ov,y+d+ov);
  const ridge1=P(x+w*0.5,y+0.4), ridge2=P(x+w*0.5,y+d-0.4);
  const r=(p)=>[p[0],p[1]-h], top=(p)=>[p[0],p[1]-h-rh];
  poly([r(RD),r(RC),top(ridge2)],{fill:roof[0],stroke:'#3b1f1f','stroke-width':2},g);
  poly([r(RC),r(RB),top(ridge1),top(ridge2)],{fill:roof[1],stroke:'#3b1f1f','stroke-width':2},g);
  poly([r(RA),r(RD),top(ridge2),top(ridge1)],{fill:roof[0],stroke:'#3b1f1f','stroke-width':2,opacity:.9},g);
  if(opts.chimney){ const cp=P(x+w*0.75,y+d*0.3); el('rect',{x:cp[0]-8,y:cp[1]-h-rh-10,width:16,height:40,fill:'#8a7b6e',stroke:'#3b2a1f','stroke-width':2},g);
    for(let i=0;i<4;i++) el('circle',{cx:cp[0]+i*10,cy:cp[1]-h-rh-24-i*22,r:10+i*5,fill:'#e8e4f0',opacity:.7-i*0.14},g); }
  if(opts.sign){ const sp=up(D); el('rect',{x:m[0]-58,y:m[1]-h-8,width:116,height:28,rx:6,fill:'#ffe3a0',stroke:'#5b3a22','stroke-width':3},g); el('text',{x:m[0],y:m[1]-h+11,'text-anchor':'middle','font-size':14,'font-weight':800,fill:'#5b3a22',class:'t'},g,opts.sign); }
  return {top:[(ridge1[0]+ridge2[0])/2, Math.min(ridge1[1],ridge2[1])-h-rh]};
}

// ---------------------------------------------------------------- chibi anime characters
function chibi(g, x, y, o){
  const s=o.s||1, f=o.face||1; // face dir 1 = right
  const G=el('g',{transform:`translate(${x},${y}) scale(${s*f},${s})`},g);
  el('ellipse',{cx:0,cy:2,rx:26,ry:9,fill:'rgba(0,0,0,.25)'},G);
  if(o.tail){ el('path',{d:'M-10,-38 q-40,-10 -38,-46 q12,20 30,26 z',fill:o.hair,stroke:'#2a1a12','stroke-width':2},G); el('path',{d:'M-44,-78 q4,8 -2,12',stroke:'#fff',fill:'none','stroke-width':3},G); }
  if(o.cape) el('path',{d:'M-16,-62 L-30,-6 L22,-6 L14,-62 Z',fill:o.cape,stroke:'#1b1630','stroke-width':2},G);
  // legs
  el('rect',{x:-11,y:-24,width:9,height:22,rx:4,fill:o.legs||'#3b3360'},G);
  el('rect',{x:3,y:-24,width:9,height:22,rx:4,fill:o.legs||'#3b3360'},G);
  el('ellipse',{cx:-6,cy:-2,rx:8,ry:5,fill:'#5b3a22'},G); el('ellipse',{cx:8,cy:-2,rx:8,ry:5,fill:'#5b3a22'},G);
  // body
  el('path',{d:'M-17,-22 Q-20,-58 0,-62 Q20,-58 17,-22 Z',fill:o.body,stroke:'#1b1630','stroke-width':2},G);
  if(o.belt) el('rect',{x:-17,y:-32,width:34,height:6,fill:o.belt},G);
  if(o.apron) el('path',{d:'M-11,-48 L11,-48 L13,-20 L-13,-20 Z',fill:o.apron,stroke:'#1b1630','stroke-width':1.5},G);
  // arms
  el('path',{d:'M-15,-56 q-12,14 -8,26',stroke:o.body,'stroke-width':9,fill:'none','stroke-linecap':'round'},G);
  el('circle',{cx:-23,cy:-30,r:5,fill:'#ffe0cc'},G);
  // weapon arm
  el('path',{d:'M15,-56 q14,6 18,-6',stroke:o.body,'stroke-width':9,fill:'none','stroke-linecap':'round'},G);
  el('circle',{cx:33,cy:-62,r:5,fill:'#ffe0cc'},G);
  if(o.weapon==='sword'){ el('path',{d:'M31,-62 L74,-118 L80,-112 L35,-58 Z',fill:'#e9f3ff',stroke:'#1b1630','stroke-width':2},G); el('rect',{x:26,y:-68,width:16,height:5,rx:2,fill:'#ffcf4d',transform:'rotate(-50 34 -65)'},G); }
  if(o.weapon==='hammer'){ el('rect',{x:31,y:-110,width:5,height:52,fill:'#7a4e2d',transform:'rotate(15 33 -62)'},G); el('rect',{x:30,y:-122,width:30,height:20,rx:3,fill:'#8d97a8',stroke:'#1b1630','stroke-width':2,transform:'rotate(15 33 -62)'},G); }
  if(o.weapon==='shield'){ el('path',{d:'M-34,-60 q14,-6 26,0 v20 q-13,16 -26,0 z',fill:'#f2f5ff',stroke:'#d9a441','stroke-width':4},G); el('path',{d:'M-21,-56 v24 M-31,-46 h20',stroke:'#d9a441','stroke-width':3},G); }
  // head
  el('circle',{cx:0,cy:-92,r:30,fill:'#ffe6d5',stroke:'#1b1630','stroke-width':2},G);
  // hair back + bangs
  el('path',{d:'M-32,-92 q0,-40 32,-40 q34,0 33,40 q-6,-12 -12,-16 q-4,10 -14,12 q2,-10 -2,-16 q-8,12 -22,14 q4,-8 2,-14 q-8,10 -17,20 z',fill:o.hair,stroke:'#1b1630','stroke-width':2},G);
  if(o.longHair) el('path',{d:'M-31,-96 q-6,40 4,60 l8,-8 q-4,-24 -2,-48 z M31,-96 q6,40 -4,60 l-8,-8 q4,-24 2,-48 z',fill:o.hair,stroke:'#1b1630','stroke-width':2},G);
  if(o.ears==='wolf'){ el('path',{d:'M-24,-118 l-6,-30 l22,16 z',fill:o.hair,stroke:'#1b1630','stroke-width':2},G); el('path',{d:'M24,-118 l6,-30 l-22,16 z',fill:o.hair,stroke:'#1b1630','stroke-width':2},G); el('path',{d:'M-23,-122 l-3,-16 l11,9 z M23,-122 l3,-16 l-11,9 z',fill:'#ffc7c7'},G); }
  if(o.horns){ el('path',{d:'M-18,-120 q-14,-18 -4,-34 q2,16 12,26 z M18,-120 q14,-18 4,-34 q-2,16 -12,26 z',fill:'#3a2a4a',stroke:'#1b1630','stroke-width':2},G); }
  if(o.halo){ el('ellipse',{cx:0,cy:-132,rx:20,ry:6,fill:'none',stroke:'#ffe27a','stroke-width':4},G); }
  // eyes (big anime eyes)
  [[-11,o.eyeL||0],[11,0]].forEach(([ex])=>{
    el('ellipse',{cx:ex,cy:-86,rx:7,ry:10,fill:'#fff',stroke:'#1b1630','stroke-width':1.5},G);
    el('ellipse',{cx:ex+1,cy:-85,rx:5.5,ry:8,fill:o.eye||'#3a7bd5'},G);
    el('ellipse',{cx:ex+1,cy:-83,rx:3,ry:5,fill:'#1b1630'},G);
    el('circle',{cx:ex-1,cy:-89,r:2.4,fill:'#fff'},G);
    el('path',{d:`M${ex-8},-97 q8,-5 16,0`,stroke:'#1b1630','stroke-width':2.5,fill:'none'},G);
  });
  el('ellipse',{cx:-18,cy:-76,rx:5,ry:2.5,fill:'#ff9fb0',opacity:.7},G); el('ellipse',{cx:18,cy:-76,rx:5,ry:2.5,fill:'#ff9fb0',opacity:.7},G);
  el('path',{d:o.mouth||'M-4,-72 q4,4 8,0',stroke:'#7a2a2a','stroke-width':2,fill:o.mouthFill||'none'},G);
  return G;
}

function frog(g, x, y, s=1){
  const G=el('g',{transform:`translate(${x},${y}) scale(${s})`},g);
  el('ellipse',{cx:0,cy:4,rx:80,ry:20,fill:'rgba(0,0,0,.25)'},G);
  el('ellipse',{cx:0,cy:-50,rx:78,ry:58,fill:'#5fc46a',stroke:'#1b3b20','stroke-width':3},G);
  el('ellipse',{cx:0,cy:-30,rx:58,ry:36,fill:'#d9f2a6'},G);
  el('ellipse',{cx:-60,cy:-8,rx:28,ry:12,fill:'#4fae5a',stroke:'#1b3b20','stroke-width':3},G);
  el('ellipse',{cx:60,cy:-8,rx:28,ry:12,fill:'#4fae5a',stroke:'#1b3b20','stroke-width':3},G);
  [[-32,-112],[32,-112]].forEach(([ex,ey])=>{ el('circle',{cx:ex,cy:ey,r:24,fill:'#5fc46a',stroke:'#1b3b20','stroke-width':3},G); el('circle',{cx:ex,cy:ey,r:15,fill:'#fff'},G); el('circle',{cx:ex+3,cy:ey+2,r:8,fill:'#1b1630'},G); el('circle',{cx:ex,cy:ey-2,r:3,fill:'#fff'},G); });
  el('path',{d:'M-50,-70 q50,34 100,0',stroke:'#1b3b20','stroke-width':4,fill:'none'},G);
  // tongue lashing
  el('path',{d:'M-46,-68 q-60,-10 -100,-50',stroke:'#ff6f91','stroke-width':10,fill:'none','stroke-linecap':'round'},G);
  [[-20,-80],[20,-60],[40,-90],[-40,-40]].forEach(([sx,sy])=>el('circle',{cx:sx,cy:sy,r:6,fill:'#4aa056',opacity:.6},G));
  return G;
}
function slime(g,x,y,c='#8fd3ff',s=1){ const G=el('g',{transform:`translate(${x},${y}) scale(${s})`},g); el('ellipse',{cx:0,cy:3,rx:28,ry:8,fill:'rgba(0,0,0,.2)'},G);
  el('path',{d:'M-28,0 q-4,-40 28,-44 q32,4 28,44 z',fill:c,stroke:'#1b1630','stroke-width':2,opacity:.92},G); el('ellipse',{cx:-10,cy:-30,rx:6,ry:4,fill:'#fff',opacity:.8},G);
  el('circle',{cx:-8,cy:-18,r:3.5,fill:'#1b1630'},G); el('circle',{cx:8,cy:-18,r:3.5,fill:'#1b1630'},G); el('path',{d:'M-5,-10 q5,4 10,0',stroke:'#1b1630','stroke-width':2,fill:'none'},G); }

function fence(g,P,x1,y1,x2,y2){ const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))*2; let prev=null;
  for(let i=0;i<=n;i++){ const t=i/n; const p=P(x1+(x2-x1)*t,y1+(y2-y1)*t); el('rect',{x:p[0]-3,y:p[1]-30,width:6,height:30,fill:'#b07a45',stroke:'#4a2e18','stroke-width':1.5},g); if(prev){ el('line',{x1:prev[0],y1:prev[1]-22,x2:p[0],y2:p[1]-22,stroke:'#b07a45','stroke-width':4},g); el('line',{x1:prev[0],y1:prev[1]-10,x2:p[0],y2:p[1]-10,stroke:'#b07a45','stroke-width':4},g);} prev=p; } }

function dmg(g,x,y,text,color,size=40){ el('text',{x,y,'text-anchor':'middle','font-size':size,'font-weight':900,fill:color,stroke:'#1b1630','stroke-width':6,'paint-order':'stroke',class:'t','font-style':'italic'},g,text); }

// ---------------------------------------------------------------- HUD widgets
function panel(g,x,y,w,h,r=14){ return el('rect',{x,y,width:w,height:h,rx:r,fill:'var(--panel)',stroke:'#f4e3b5','stroke-opacity':.55,'stroke-width':2,filter:'url(#sh)'},g); }
function bar(g,x,y,w,h,frac,fill,label){ el('rect',{x,y,width:w,height:h,rx:h/2,fill:'#0d0a1f',stroke:'#000','stroke-opacity':.4},g); el('rect',{x:x+2,y:y+2,width:(w-4)*frac,height:h-4,rx:(h-4)/2,fill},g); el('rect',{x:x+2,y:y+2,width:(w-4)*frac,height:(h-4)/2.5,rx:(h-4)/4,fill:'#fff',opacity:.25},g); if(label) el('text',{x:x+w/2,y:y+h-5,'text-anchor':'middle','font-size':h-7,'font-weight':800,fill:'#fff',stroke:'#000','stroke-width':3,'paint-order':'stroke',class:'t'},g,label); }
function portrait(g,x,y,r,opts){ el('circle',{cx:x,cy:y,r:r+4,fill:'url(#btnGold)',filter:'url(#sh)'},g); el('circle',{cx:x,cy:y,r,fill:'#cfe8ff'},g);
  const clip='c'+Math.floor(rnd()*1e9); const cp=el('clipPath',{id:clip},g); el('circle',{cx:x,cy:y,r},cp);
  const inner=el('g',{'clip-path':`url(#${clip})`},g); chibi(inner,x,y+r*2.25,Object.assign({s:r/34},opts)); }
function icon(g,cx,cy,type){
  const s={stroke:'#fff','stroke-width':4,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
  if(type==='slash'){ el('path',Object.assign({d:`M${cx-18},${cy+16} Q${cx-10},${cy-22} ${cx+20},${cy-18}`},s),g); el('path',Object.assign({d:`M${cx-8},${cy+18} Q${cx},${cy-8} ${cx+22},${cy-4}`},s,{opacity:.6}),g); }
  if(type==='spin'){ el('circle',Object.assign({cx,cy,r:16},s,{'stroke-dasharray':'60 20'}),g); el('path',Object.assign({d:`M${cx+14},${cy-12} l6,-2 l-1,7`},s),g); }
  if(type==='dash'){ [0,8,16].forEach(o=>el('path',Object.assign({d:`M${cx-18+o},${cy-14} l12,14 l-12,14`},s,{opacity:1-o/30}),g)); }
  if(type==='shield'){ el('path',Object.assign({d:`M${cx},${cy-20} l16,6 v10 q0,14 -16,22 q-16,-8 -16,-22 v-10 z`},s),g); }
  if(type==='heal'){ el('path',{d:`M${cx-6},${cy-18} h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 z`,fill:'#9effa5'},g); }
  if(type==='star'){ let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?8:20; d+=(i?'L':'M')+(cx+r*Math.cos(a))+','+(cy+r*Math.sin(a)); } el('path',{d:d+'Z',fill:'#ffe27a'},g); }
